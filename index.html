<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RECIO | Hands On 1 (Flexbox)</title>

        <!-- CSS -->
        <link rel="stylesheet" href="styles.css">

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <!-- Hands On 1 Output -->
        <div class="property-card total">
            <div class="icon">
                <img src="images/home.png" alt="Home Icon">
            </div>
            <div class="info">
                <h1>510</h1>
                <p>Properties in total</p>
            </div>
        </div>

        <div class="property-card sale">
            <div class="icon">
                <img src="images/add-to-cart.png" alt="Add to Cart Icon">
            </div>
            <div class="info">
                <h1>253</h1>
                <p>Properties for sale</p>
            </div>
        </div>

        <div class="property-card rental">
            <div class="icon">
                <img src="images/check.png" alt="Profile Check Icon">
            </div>
            <div class="info">
                <h1>257</h1>
                <p>Properties for rental</p>
            </div>
        </div>
    </body>
</html>
